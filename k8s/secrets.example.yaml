# Not applied automatically. Create the real secret from the command line instead:
#   kubectl -n taskboard create secret generic taskboard-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: taskboard-secrets
  namespace: taskboard
type: Opaque
stringData:
  JWT_SECRET: replace-me
